# IP Whitelist Configuration
# ─────────────────────────────────────────────────────────
# To restrict access to specific IPs:
# 1. Add "allow" lines for each trusted IP/subnet
# 2. Uncomment "deny all" at the bottom
# 3. Restart nginx: docker compose -f docker-compose.prod.yml restart nginx
#
# Examples:
#   allow 203.0.113.50;       # Single IP
#   allow 198.51.100.0/24;    # Entire subnet
#
# ─────────────────────────────────────────────────────────

# Add your trusted IPs below:
# allow 1.2.3.4;
# allow 5.6.7.8;

# Uncomment the next line to block all non-whitelisted IPs:
# deny all;
