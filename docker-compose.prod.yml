services:
  # ── Database ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trader}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Cache ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save 300 1 --save 60 100 --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 192M

  # ── IB Gateway ───────────────────────────────────────────
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    environment:
      TWS_USERID: ${IBKR_USERNAME:?Set IBKR_USERNAME in .env}
      TWS_PASSWORD: ${IBKR_PASSWORD:?Set IBKR_PASSWORD in .env}
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}
      TWS_ACCEPT_INCOMING: "accept"
      READ_ONLY_API: "no"
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-trader123}
      # Auto-restart after IBKR's daily maintenance (~23:45 UTC)
      # Gateway restarts at 12:05 AM ET = 05:05 UTC, before markets open
      AUTO_RESTART_TIME: "12:05 AM"
      # Cold restart on Sundays (full re-auth) before weekly market open
      TWS_COLD_RESTART: "07:00"
      # Auto re-login after 2FA timeout instead of exiting
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      TWOFA_TIMEOUT_ACTION: "restart"
    ports:
      - "5900:5900"   # VNC for manual login / 2FA if needed
      - "4002:4002"   # IB Gateway API port (paper)
    volumes:
      - ib_gateway_data:/home/ibgateway/Jts
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/4002' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # ── IB API Proxy ────────────────────────────────────────
  # socat forwards API traffic to 127.0.0.1 so IB Gateway
  # sees connections from a trusted IP (localhost).
  ib-proxy:
    image: alpine/socat
    network_mode: "service:ib-gateway"
    command: TCP-LISTEN:4003,fork,reuseaddr TCP:127.0.0.1:4002
    depends_on:
      ib-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4003 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          memory: 32M

  # ── Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      IBKR_HOST: ib-gateway
      IBKR_PORT: 4003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ib-proxy:
        condition: service_healthy
    volumes:
      - ./ml/models:/app/ml/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost',8000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Nginx (reverse proxy + frontend) ────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ip-whitelist.conf:/etc/nginx/conf.d/ip-whitelist.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Frontend build (one-shot) ────────────────────────────
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    volumes:
      - frontend_build:/output
    entrypoint: ["sh", "-c", "cp -r /app/dist/* /output/"]
    restart: "no"

  # ── Certbot (SSL renewal) ───────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

volumes:
  postgres_data:
  redis_data:
  ib_gateway_data:
  frontend_build:
  certbot_www:
  certbot_certs:
