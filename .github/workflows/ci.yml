name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests and deploy directly"
        type: boolean
        default: false

jobs:
  # Detect which files changed to skip unnecessary jobs
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-test:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true'
      && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: trader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check app/ tests/ --select E,F,W

      - name: Run tests
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: >-
            postgresql+asyncpg://trader:testpassword@localhost:5432/trader_test
          REDIS_URL: redis://localhost:6379
        run: uv run pytest tests/ -x -q --tb=short

  frontend-build:
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true'
      && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check & build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [changes, backend-test, frontend-build]
    if: |
      always()
      && github.event_name != 'pull_request'
      && (github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key root@"$SERVER_HOST" '
            cd /root/trader &&
            git fetch origin master &&
            git reset --hard origin/master &&
            docker compose -f docker-compose.prod.yml up -d --build backend frontend-build &&
            docker compose -f docker-compose.prod.yml exec -T -w /app backend uv run alembic upgrade head &&
            docker compose -f docker-compose.prod.yml restart nginx
          '
          rm -f ~/.ssh/deploy_key
