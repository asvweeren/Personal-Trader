name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: trader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check app/ tests/ --select E,F,W

      - name: Run tests
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: >-
            postgresql+asyncpg://trader:testpassword@localhost:5432/trader_test
          REDIS_URL: redis://localhost:6379
        run: uv run pytest tests/ -x -q --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type check & build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to production
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_HOST }} '
            cd /root/trader &&
            git pull origin master &&
            docker compose -f docker-compose.prod.yml up -d --build backend frontend-build &&
            docker compose -f docker-compose.prod.yml exec -T -w /app backend uv run alembic upgrade head &&
            docker compose -f docker-compose.prod.yml restart nginx
          '
